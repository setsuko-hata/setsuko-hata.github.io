<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>SATORI icons</title>
<style>
body{margin:0;padding:40px;background:#FBF7EF;color:#40392F;font:14px/1.6 "Zen Kaku Gothic New",sans-serif}
h1{font-weight:400;font-size:22px;margin:0 0 28px}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:28px}
.c{width:150px;padding:18px 10px;border-top:1px solid #B99755;text-align:center}
.c svg{width:48px;height:48px;display:block;margin:0 auto 10px}
.c.big svg{width:96px;height:96px}.c.sm svg{width:24px;height:24px}
.olive{color:#596044}.brown{color:#8A6043}.gold{color:#B99755}.sage{color:#7E8764}
.wide{width:300px}.wide svg{width:280px;height:auto}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="sun" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="7"/>
    <path d="M24 8v5M24 35v5M8 24h5M35 24h5M31.8 16.2l2.1-2.1M16.2 16.2l-2.1-2.1M31.8 31.8l2.1 2.1M16.2 31.8l-2.1 2.1"/>
  </symbol>
  <symbol id="sunarc" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 32h36M14 32a10 10 0 0 1 20 0M24 14v4M10.5 20l3 3M37.5 20l-3 3M16 38h16M20 43h8"/>
  </symbol>
  <symbol id="moon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 8.5A16 16 0 1 0 39.5 32 12.5 12.5 0 0 1 31 8.5Z"/>
  </symbol>
  <symbol id="star" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6l3.2 14.8L42 24l-14.8 3.2L24 42l-3.2-14.8L6 24l14.8-3.2Z"/>
  </symbol>
  <symbol id="ripple" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6c-3.2 4.4-4.8 7.2-4.8 9.4a4.8 4.8 0 0 0 9.6 0C28.8 13.2 27.2 10.4 24 6Z"/>
    <ellipse cx="24" cy="31" rx="4" ry="1.6"/>
    <ellipse cx="24" cy="31" rx="10" ry="4"/>
    <ellipse cx="24" cy="31" rx="17" ry="6.5"/>
  </symbol>
  <symbol id="sprout" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 42V21M14 42h20"/>
    <path d="M24 30c-8 0-12.5-4-12.5-11 8 0 12.5 4 12.5 11Z"/>
    <path d="M24 22c0-7.5 4.2-11.5 12.5-11.5 0 7.5-4.2 11.5-12.5 11.5Z"/>
  </symbol>
  <symbol id="breath" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 18c6-5 10-5 16 0s10 5 16 0M6 26c6-5 10-5 16 0s10 5 16 0M10 34c5-4 8-4 13 0s8 4 13 0"/>
  </symbol>
  <symbol id="branch" viewBox="0 0 240 90" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 82C56 80 130 66 236 12"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(23.7 80.7) rotate(-63) scale(0.95)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(41.6 78.6) rotate(50) scale(0.91)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(65.1 74.7) rotate(-69) scale(0.86)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(88.5 69.5) rotate(44) scale(0.82)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(116.2 61.7) rotate(-75) scale(0.77)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(143.7 52.5) rotate(38) scale(0.73)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(176.2 39.8) rotate(-81) scale(0.68)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(205.2 27.0) rotate(33) scale(0.64)"/>
    <path d="M0 0c7-5 15-4 20 2-7 5-15 4-20-2Z" transform="translate(234.0 13.0) rotate(-27) scale(0.60)"/>
  </symbol>
  <symbol id="divider" viewBox="0 0 160 20" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 10h62M98 10h62"/>
    <path d="M80 2l3.5 8-3.5 8-3.5-8Z"/>
    <path d="M72 10h.1M88 10h.1M66 10h.1M94 10h.1"/>
  </symbol>
</svg>

<h1>SATORI line icons: sizes 24 / 48 / 96, colours olive, brown, gold, sage</h1>
<div class="row" id="r"></div>
<script>
const ids=["sun","sunarc","moon","star","ripple","sprout","breath","branch","divider"];
const cols=["olive","brown","gold","sage"];
const r=document.getElementById("r");
ids.forEach((id,i)=>{
  ["sm","","big"].forEach(s=>{
    const w=id==="branch"||id==="divider";
    r.insertAdjacentHTML("beforeend",`<div class="c ${s} ${cols[i%4]} ${w?'wide':''}"><svg aria-hidden="true"><use href="#${id}"/></svg>${id}</div>`);
  });
});
</script></body></html>
