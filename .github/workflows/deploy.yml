name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public by design: it ships in the page's JS. .env is gitignored, so CI needs it here.
      PUBLIC_SIGNUP_ENDPOINT: https://script.google.com/macros/s/AKfycbzJjvddoresqI4B_FyhkNb3iSZvjTwWncf-P7sUnWHYOQEZCBN_s63W3LMaUVk3ZtES/exec
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
